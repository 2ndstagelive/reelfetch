<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ReelFetch English</title>
</head>
<body>

<h1>Instagram & YouTube Downloader</h1>

<p>Paste URL</p>

<input id="url" type="text" size="50">

<button onclick="downloadVideo()">Check</button>

<p id="result"></p>

<script>
async function downloadVideo() {
  const url = document.getElementById("url").value;
  const result = document.getElementById("result");

  result.innerText = "Checking...";

  try {
    const res = await fetch(
      "https://reelfetch-api-bdhs.onrender.com/download?url=" +
      encodeURIComponent(url)
    );

    const data = await res.json();

    if (data.title) {
      result.innerText = "Title: " + data.title;
    } else {
      result.innerText = "Error: " + (data.error || "Could not fetch");
    }

  } catch (e) {
    result.innerText = "Network error: " + e.message;
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ReelFetch 日本語</title>
</head>
<body>

<h1>Instagram・YouTube Downloader</h1>

<p>URLを入力してください</p>

<input id="url" type="text" size="50">

<button onclick="downloadVideo()">確認</button>

<p id="result"></p>

<script>
async function downloadVideo() {
  const url = document.getElementById("url").value;
  const result = document.getElementById("result");

  result.innerText = "確認中...";

  try {
    const res = await fetch(
      "https://reelfetch-api-bdhs.onrender.com/download?url=" +
      encodeURIComponent(url)
    );

    const data = await res.json();

    if (data.title) {
      result.innerText = "タイトル: " + data.title;
    } else {
      result.innerText = "エラー: " + (data.error || "取得できませんでした");
    }

  } catch (e) {
    result.innerText = "通信エラー: " + e.message;
  }
}
</script>

</body>
</html>

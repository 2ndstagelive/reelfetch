<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ReelFetch 日本語</title>
</head>
<body>

<h1>Instagram・YouTube Downloader</h1>

<p>URLを入力してください</p>

<input id="url" type="text" size="50">

<button onclick="downloadVideo()">確認</button>

<script>
async function downloadVideo() {
  const url = document.getElementById("url").value;

  const res = await fetch(
    "https://reelfetch-api-bdhs.onrender.com/download?url=" +
    encodeURIComponent(url)
  );

  const data = await res.json();

  alert(data.title || data.error);
}
</script>

</body>
</html>
